<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TERCERA WEB</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            text-align: center;
            padding: 5px;
        }
        .verde { background-color: #2e8b57; color: white; }
        .rosado { background-color: #dda0dd; }
        .rojo { background-color: #cd5c5c; color: white; }
        .amarillo { background-color: #ffd700; }
        .descanso { background-color: #dcdcdc; }
    </style>
</head>
<body>
    <table>
        <caption><strong>TERCERA WEB</strong></caption>
        <tr>
            <th>Per.</th>
            <th>Hrs.</th>
            <th>LUNES</th>
            <th>MARTES</th>
            <th>MIERCOLES</th>
            <th>JUEVES</th>
            <th>VIERNES</th>
        </tr>
        <tr>
            <td>1</td>
            <td>08:00 - 08:45</td>
            <td rowspan="4" class="verde">TEW-300</td>
            <td rowspan="4" class="verde">SIM-300</td>
            <td rowspan="4" class="rosado">ELT-300</td>
            <td rowspan="4" class="verde">ELG-300</td>
            <td rowspan="4" class="rojo">PRG-300</td>
        </tr>
        <tr>
            <td>2</td>
            <td>08:45 - 09:30</td>
        </tr>
        <tr>
            <td>3</td>
            <td>09:30 - 10:15</td>
        </tr>
        <tr>
            <td>4</td>
            <td>10:15 - 11:00</td>
        </tr>
        <tr>
            <td colspan="7" class="descanso">DESCANSO</td>
        </tr>
        <tr>
            <td>5</td>
            <td>11:30 - 12:15</td>
            <td rowspan="2" class="amarillo">BDD-300</td>
            <td rowspan="2" class="verde">SIM-300</td>
            <td rowspan="2" class="rosado">ELT-300</td>
            <td rowspan="2" class="verde">ELG-300</td>
            <td rowspan="2" class="rojo">PRG-300</td>
        </tr>
        <tr>
            <td>6</td>
            <td>12:15 - 13:00</td>
        </tr>
    </table>
</body>
</html>
